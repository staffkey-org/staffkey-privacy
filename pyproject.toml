[project]
name = "staffkey-privacy"
version = "0.1.0"
description = "Staffkey anonymization layer — open, auditable: k-anonymity + contributor pseudonymization. Only derived, anonymized points cross the private->pool boundary."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Staffkey" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/staffkey_privacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["staffkey_privacy"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
